name: SecureBank Full CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. BACKEND CI ────────────────────────────────────────────────────────
  backend-ci:
    name: Backend Build & Test (Java 17 Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile Backend
        run: |
          cd backend
          mvn clean compile -DskipTests -B

      - name: Run Unit & Integration Tests
        run: |
          cd backend
          mvn test -Dspring.profiles.active=dev -B

      - name: Package Spring Boot Executable JAR
        run: |
          cd backend
          mvn package -DskipTests -B

      - name: Upload Backend Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: securebank-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ─── 2. FRONTEND CI ───────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Build & Typecheck (React + Vite + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck & Build Production Assets
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: securebank-frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── 3. DOCKER BUILD & VERIFICATION ──────────────────────────────────────
  docker-ci:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: securebank-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: securebank-frontend:latest

      - name: Validate Docker Compose Configuration
        run: docker compose config

  # ─── 4. CONTINUOUS DEPLOYMENT STAGE ───────────────────────────────────────
  deploy-staging:
    name: CD Release Readiness & Artifact Bundling
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: securebank-backend-jar
          path: deploy/backend

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: securebank-frontend-dist
          path: deploy/frontend

      - name: Summary Report
        run: |
          echo "=================================================="
          echo "🚀 SECUREBANK CI/CD PIPELINE PASSED SUCCESSFULLY"
          echo "=================================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Backend JAR: $(ls -l deploy/backend)"
          echo "Frontend Dist: $(ls -l deploy/frontend)"
          echo "All builds, tests, and container checks completed with 0 errors!"
